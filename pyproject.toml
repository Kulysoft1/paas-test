[project]
name = "paas-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kuly", email = "kuly@kuly.ro" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-redis>=7.0.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[project.scripts]
